schema: spec-driven

# Project context (optional)
# This is shown to AI when creating artifacts.
# Add your tech stack, conventions, style guides, domain knowledge, etc.
# Example:
#   context: |
#     Tech stack: TypeScript, React, Node.js
#     We use conventional commits
#     Domain: e-commerce platform

# Per-artifact rules (optional)
# Add custom rules for specific artifacts.
# Example:
#   rules:
#     proposal:
#       - Keep proposals under 500 words
#       - Always include a "Non-goals" section
#     tasks:
#       - Break tasks into chunks of max 2 hours

# Per-operation guidance (optional)
# Add advisory guidance for how apply and archive work should be conducted.
# This is separate from artifact rules above.
# Example:
#   operations:
#     apply:
#       guidance:
#         - Keep test summaries concise
#     archive:
#       guidance:
#         - Summarize the archive outcome before finishing

operations:
  apply:
    guidance:
      - "Before implementing the first task, ensure you're on a git branch named after this change (create it from an up-to-date main via `git checkout -b <change-name>` if it doesn't exist yet). Commit and push to this feature branch as you complete tasks -- never push directly to main. See AGENTS.md §3.1."
      - "Once tasks.md is complete (or the implementation session ends in a coherent state) and pushed, open a pull request into main with `gh pr create` if one doesn't already exist for this branch (check with `gh pr list --head <branch>`) -- standing authorization, no need to ask. The PR at this point reflects the implemented code, still without the archived specs (that lands later via /opsx:archive, updating the same PR). See AGENTS.md §3.1."
  archive:
    guidance:
      - "After archiving (syncing delta specs, moving the change to archive/), commit and push that result on the same feature branch -- this updates the PR /opsx:apply already opened, it does not create a new one. If no PR exists yet for some reason, open one now with `gh pr create` as a fallback. See AGENTS.md §3.1."
      - "Adversarial code review is a separate, optional step -- it is NOT run automatically as part of archiving. Run the `/adversarial-review` command yourself before archiving if you want it (recommended, but the user's call), or the user runs it directly. See AGENTS.md §3.1/§3.2."
      - "Once the PR is open, merge it into main yourself (`gh pr merge`) -- no CI gate, no separate confirmation for the merge. Standing authorization, same as the commit/push/PR-create steps above. See AGENTS.md §3.1."
