appId: com.easyphotoprint.app
productName: Easy Photo Print
directories:
  output: release
# Publishing is disabled via the --publish never CLI flag (see package.json's
# build:desktop:release script and .github/workflows/release-build.yml), not here --
# "publish: never" as a config-file value doesn't work: electron-builder tries to resolve
# "never" as a publish *provider* module and fails with "Cannot find module for publisher never".
files:
  - out/**
  - package.json
  # App window icon, referenced from the main process via electron-vite's `?asset` import.
  - resources/**
linux:
  # Generated by scripts/generate-icons.mjs: one <N>x<N>.png per hicolor size.
  icon: build/icons
  target:
    - AppImage
    - deb
    - pacman
  category: Graphics
  maintainer: Exequiel <exe4que@gmail.com>
win:
  # Converted to .ico by electron-builder (needs >= 256px).
  icon: build/icon.png
  target:
    - nsis
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
